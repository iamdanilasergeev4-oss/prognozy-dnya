name: Обновление прогнозов

on:
  schedule:
    - cron: "0 4 * * *"   # каждый день в 07:00 по Москве (04:00 UTC)
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать прогнозы
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PAGE_CHARS: ${{ vars.PAGE_CHARS }}
        run: |
          # пустые vars не должны перебивать значения по умолчанию
          [ -z "$LLM_BASE_URL" ] && unset LLM_BASE_URL
          [ -z "$LLM_MODEL" ] && unset LLM_MODEL
          [ -z "$PAGE_CHARS" ] && unset PAGE_CHARS
          python scripts/update.py

      - name: Сохранить изменения
        run: |
          git config user.name "predictions-bot"
          git config user.email "predictions-bot@users.noreply.github.com"
          git add data/predictions.json
          git diff --cached --quiet || git commit -m "Прогнозы на $(TZ=Europe/Moscow date +%d.%m.%Y)"
          git push
